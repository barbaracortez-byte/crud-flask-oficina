<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Peças</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<h1>Lista de Peças</h1>
<form action="/pecas/enviar" method="POST">
    <label>Nome da Peça</label>
    <input type="text" name="nome_peca" maxlength="100" required>

    <label>Quantidade</label>
    <input type="text" name="quantidade" maxlength="100" required>

    <label>Marca</label>
    <input type="text" name="marca" maxlength="100" required>

    <label>Preço</label>
    <input type="text" name="preco" maxlength="100" required>

    <button type="submit">Adicionar Peças</button>
</form>
<table>
    <tr>
        <th>#</th>
        <th>Nome da Peça</th>
        <th>Quantidade</th>
        <th>Marca</th>
        <th>Preço</th>
    </tr>

    {% for peca in pecas %}
    <tr>
        <td>{{ peca[0] }}</td>
        <td>{{ peca[1] }}</td>
        <td>{{ peca[2] }}</td>
        <td>{{ peca[3] }}</td>
        <td>{{ peca[4] }}</td>
        <td class="acoes">
            <a class="botao editar" href="/pecas/editar/{{ peca[0] }}">Editar</a>
            <form action="/pecas/excluir/{{ peca[0] }}" method="POST">
            <button type="submit">Excluir</button>
        </form>
        </td>
        </tr>
    {% else %}
        <tr>
            <td colspan="4">Nenhuma peça cadastrada.</td>
        </tr>
    {% endfor %}
    </table>
<div class="botoes-navegacao">
    <a href="/">Voltar para a página inicial</a>
    <a href="/veiculos">Gerenciar veículos</a>
</div>

</body>
</html>
